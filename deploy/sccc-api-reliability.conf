[Unit]
# Prevent a port conflict or boot failure from creating an unbounded restart
# storm. Five failures in five minutes leaves the unit failed and visible.
StartLimitIntervalSec=300
StartLimitBurst=5

[Service]
# Recover from signals and unexpected clean exits as well as non-zero failures.
# An intentional `systemctl stop` still remains stopped.
Restart=always
RestartSec=5
